services:
  windows:
    container_name: windows
    image: ghcr.io/dockur/windows
    environment:
      RAM_SIZE: "half"
      DISK_SIZE: "max"
      CPU_CORES: "max"
      DISK_MINIMUM: "1G"
      VERSION: "tiny10"
      USERNAME: "Aquamareef"
      PASSWORD: "1314"
      RAM_SIZE: "8G"
      CPU_CORES: "6"
      AUDIO: "Y"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
    restart: on-failure
    stop_grace_period: 2m
